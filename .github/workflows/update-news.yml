name: Update Crypto News

on:
  schedule:
    # Run every hour
    - cron: "0 * * * *"
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch news from Google News RSS
        id: fetch-news
        run: |
          echo "Fetching news from Google News RSS..."
          curl -v "https://news.google.com/rss/search?q=cryptocurrency" > news_raw.xml 2>&1

          # Check if fetch succeeded
          if [ ! -s news_raw.xml ]; then
            echo "ERROR: Failed to fetch RSS or file is empty"
            cat news_raw.xml
            exit 1
          fi

          # Check raw XML
          echo "Raw XML (first 500 chars):"
          head -c 500 news_raw.xml
          echo ""
          echo "Total XML size:"
          wc -c news_raw.xml

          # Parse XML and format news
          node -e "
          const fs = require('fs');
          const xml = fs.readFileSync('news_raw.xml', 'utf8');

          console.log('XML length:', xml.length);
          console.log('Contains <item>:', xml.includes('<item>'));
          console.log('Contains <title>:', xml.includes('<title>'));

          const items = [];
          const itemRegex = /<item>([\\s\\S]*?)<\\/item>/g;
          let match;
          let itemCount = 0;

          while ((match = itemRegex.exec(xml)) !== null) {
            itemCount++;
            const itemContent = match[1];
            const titleMatch = itemContent.match(/<title>(.*?)<\\/title>/);
            const linkMatch = itemContent.match(/<link>(.*?)<\\/link>/);
            const pubDateMatch = itemContent.match(/<pubDate>(.*?)<\\/pubDate>/);
            const descMatch = itemContent.match(/<description>(.*?)<\\/description>/);
            const sourceMatch = itemContent.match(/<source.*?>(.*?)<\\/source>/);

            const title = titleMatch ? titleMatch[1] : '';
            const description = descMatch ? descMatch[1] : '';
            const link = linkMatch ? linkMatch[1] : '';
            const pubDate = pubDateMatch ? pubDateMatch[1] : new Date().toISOString();
            const source = sourceMatch ? sourceMatch[1] : 'Google News';

            // Remove HTML tags from description
            const plainText = description.replace(/<[^>]*>/g, '').substring(0, 300) + '...';

            if (title) {
              items.push({
                id: items.length + 1,
                title: title,
                content: plainText,
                category: 'Crypto',
                date: pubDate,
                image_url: null,
                source_url: link,
                source_name: source
              });
            }
          }

          console.log('Found', itemCount, 'items with regex');
          console.log('Parsed', items.length, 'valid articles');

          fs.writeFileSync('src/data/news.json', JSON.stringify(items, null, 2));
          console.log('Updated news.json with', items.length, 'articles');
          "

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet src/data/news.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/news.json
          git commit -m "Update crypto news [skip ci]"
          git push
